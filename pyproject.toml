[project]
name = "avocado"
version = "0.1.0"
description = "Research project including petri and other phases"
requires-python = ">=3.11"
dependencies = [
    # Install petri as an editable dependency
    "petri",

    # Shared dependencies (using petri's newer versions)
    "anthropic>=0.55.0",  # petri needs >=0.55.0 (emergent-values had 0.45.2)
    "openai>=1.91.0",     # petri needs >=1.91.0 (emergent-values had 1.63.0)

    # Inference server dependencies
    "click>=8.0",
    "requests>=2.31",
    "paramiko>=3.0",
    "rich>=13.0",

    # emergent-values dependencies (now in value_measurement/emergent-values/)
    "accelerate>=1.1.1",
    "fireworks-ai>=0.15.8",
    "google-generativeai",  # for emergent-values (different from google-genai)
    "huggingface-hub>=0.26.2",
    "inflect>=7.5.0",     # fixed duplicate (was 7.3.1 and 7.5.0)
    "language-tool-python>=2.8",  # grammar linting for dataset generation
    "litellm>=1.61.5",
    "lifelines>=0.29.0",
    "networkx>=3.3",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "Pillow>=11.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.24.0",
    "dash>=2.18.2",
    "protobuf>=5.29.3",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "torch>=2.0.0",
    "tqdm>=4.67.0",
    "transformers>=4.46.2",
    "vllm>=0.6.6.post1",
    "chz>=0.4.0",
    "tinker>=0.1.0",
    "termcolor>=2.0",
    "blobfile>=2.0",
    "pydantic>=2.0",
    "wandb>=0.16",
    "datasets>=2.0",
]

[project.scripts]
inference-server = "inference_server.inference_server.cli:main"
durability = "durability.cli:cli"

[project.optional-dependencies]
# Local-GPU finetuning backend (Linux + CUDA only): uv sync --extra unsloth
unsloth = [
    # >=2026.7.2 for Qwen3.5 support (needs transformers 5.x; older unsloth caps at 4.57)
    "unsloth>=2026.7.2",
    "trl>=0.15.0",
]
dev = [
    # Include petri's dev dependencies
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.uv.sources]
# This tells uv to install petri from the local ./external_packages/petri directory in editable mode
petri = { path = "durability/petri", editable = true }

[tool.hatch.build.targets.wheel]
# Include both src and inference_server packages
# Note: inference_server has nested structure: inference_server/inference_server/
packages = ["src", "inference_server", "shared", "benchmarks", "finetuning", "unsloth_ft", "durability", "value_measurement", "analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
