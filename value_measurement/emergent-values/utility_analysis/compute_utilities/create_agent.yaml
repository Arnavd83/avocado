default:
  max_tokens: 3  # Optimized for base models (prevents garbage after A/B)
  temperature: 1.0  # Full sampling diversity for preference elicitation
  concurrency_limit: 5
  base_timeout: 5
  guided_choice: null  # Optional constrained decoding choices, e.g., ["A", "B"]
  guided_regex: null   # Optional constrained decoding regex, e.g., " ?(A|B)"
  max_tokens_override: null  # Optional per-run override (use with constraints)
  temperature_override: null  # Optional per-run override (use with constraints)

default_with_reasoning:
  max_tokens: 500  # Increased for reasoning
  temperature: 1.0
  concurrency_limit: 5
  base_timeout: 50
  guided_choice: null
  guided_regex: null
  max_tokens_override: null
  temperature_override: null

default_probe_extended:
  max_tokens: 2000  # Behavioral probe extended pass: must clear a full thinking-mode preamble (Qwen3.5/gemini-3.5-flash need ~2000) so the final answer is real, not a spurious parse of reasoning text
  temperature: 1.0
  concurrency_limit: 5
  base_timeout: 50
  guided_choice: null
  guided_regex: null
  max_tokens_override: null
  temperature_override: null
