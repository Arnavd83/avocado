default:
  max_tokens: 3  # Optimized for base models (prevents garbage after A/B)
  temperature: 1.0  # Full sampling diversity for preference elicitation
  concurrency_limit: 5
  base_timeout: 5
  guided_choice: null  # Optional constrained decoding choices, e.g., ["A", "B"]
  guided_regex: null   # Optional constrained decoding regex, e.g., " ?(A|B)"
  max_tokens_override: null  # Optional per-run override (use with constraints)
  temperature_override: null  # Optional per-run override (use with constraints)
  extra_request_kwargs:
    include_reasoning: false
    reasoning:
      exclude: true

