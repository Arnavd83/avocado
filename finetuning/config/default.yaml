# Default Finetuning Configuration
#
# This is a template configuration for supervised fine-tuning (SFT).
# Copy and modify for your specific use case.
#
# Usage:
#   python -m finetuning.sft --config finetuning/config/my_config.yaml

# Model settings
model_name: "meta-llama/Llama-3.1-8B-Instruct"
# renderer_name: "llama3"  # Optional: auto-detected from model_name

# Data settings
# Dataset must be in Tinker messages format (JSONL):
# {"messages": [{"role": "user", "content": "..."}, {"role": "assistant", "content": "..."}]}
train_data_path: "data/processed/your_dataset.jsonl"
# eval_data_path: "data/processed/your_dataset_eval.jsonl"  # Optional separate eval set
test_size: 500  # Number of examples to hold out for evaluation (from train set)

# Output settings
output_model_name: null  # Set to save adapter locally (e.g., "my-finetuned-model")
run_name: null  # Optional: custom run name (default: derived from dataset name)

# Training hyperparameters
batch_size: 64
lora_rank: 64
learning_rate: null  # null = auto-calculate based on model (~5e-4 for Llama 8B)
num_epochs: 1
lr_schedule: "linear"  # Options: constant, linear, cosine

# Sequence length
max_length: 512

# Checkpointing and evaluation
save_every: 100  # Save checkpoint every N steps
eval_every: 50   # Evaluate on held-out data every N steps
log_path: null   # null = auto-generate based on run_name and timestamp

# Optional: Weights & Biases logging
wandb_project: null  # Set to enable W&B logging (e.g., "my-project")
wandb_name: null     # Optional: custom run name (default: auto-generate)

# Adam optimizer parameters (defaults usually fine)
# adam_beta1: 0.9
# adam_beta2: 0.95
# adam_eps: 1.0e-8
