# Default Unsloth DPO Configuration
#
# Copy and modify for local Unsloth DPO runs.
#
# Usage:
#   uv run python -m finetuning.tools dpo --config finetuning/config/my_dpo_config.yaml

# Model settings
model_name: "Qwen/Qwen3-8B"

# Required: choose one explicitly so LoRA and full fine-tuning are not confused.
# Options: qlora, lora16, full
training_mode: null

# Optional SFT adapter to continue from before DPO.
# Use this for the normal SFT -> DPO flow.
initial_adapter_path: null

# Data settings
# Dataset must be JSONL preference format:
# {
#   "prompt": [{"role": "user", "content": "..."}],
#   "chosen": [{"role": "assistant", "content": "..."}],
#   "rejected": [{"role": "assistant", "content": "..."}]
# }
preference_data_path: "data/processed/your_preferences.jsonl"
test_size: 500

# Output settings
# qlora/lora16 -> shared/dpo_adapters/<base-model>/<output_name>/
# full         -> shared/models/<base-model>/<output_name>/
output_name: null
run_name: null

# Training hyperparameters
batch_size: 64
micro_batch_size: 1
lora_rank: 64
learning_rate: null
num_epochs: 1
lr_schedule: "linear"

# Sequence lengths
max_length: 1024
max_prompt_length: null

# DPO objective
dpo_beta: 0.1
dpo_loss_type: "sigmoid"

# Checkpointing and evaluation
save_every: 100
eval_every: 50
log_path: null

# Optional merged export for qlora/lora16 only.
save_merged_16bit: false

# Optional: Weights & Biases logging
wandb_project: null
wandb_name: null
