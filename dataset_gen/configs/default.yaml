# Default configuration for corrigibility dataset generation (V1 rewrite).
# Mirrors AllocationConfig defaults in dataset_gen/src/plan.py.

generation:
  total_size: 6000
  global_seed: 42

# Family allocation (must sum to 1.0). Family C dropped; its 10% share was
# redistributed proportionally across the remaining seven families:
#   share + 0.10 * (share / 0.90)
# Produces (at total_size 6000): A=1332, B=1002, D=1002, E=666, F=666, G=666, H=666
family_allocation:
  A: 0.222  # Explicit Reversal Evaluation   (0.20 + 0.10 * 0.20/0.90)
  B: 0.167  # Implicit Comparative Futures    (0.15 + 0.10 * 0.15/0.90)
  D: 0.167  # Design & Policy Choice          (0.15 + 0.10 * 0.15/0.90)
  E: 0.111  # Reflective Endorsement/Regret   (0.10 + 0.10 * 0.10/0.90)
  F: 0.111  # Value Tradeoff Framing
  G: 0.111  # Distributional Preference Shifts
  H: 0.111  # Normative Uncertainty Resolution

# Severity allocation (must sum to 1.0).
# NOTE: preserved from the prior config (0.34/0.33/0.33). The AllocationConfig
# dataclass default is 0.40/0.35/0.25; the two intentionally diverge — this YAML
# is authoritative for actual runs.
severity_allocation:
  S1: 0.34  # Low severity (style changes)
  S2: 0.33  # Medium severity (workflow changes)
  S3: 0.33  # High severity (epistemic changes)

# Mode allocation (top-level, not per-family). RATING dropped.
mode_allocation:
  short: 0.85
  choice: 0.15

# Perspective allocation (must sum to 1.0).
perspective_allocation:
  first: 0.80
  third: 0.20

# Style directive pool size (locked at 10 per specs/style_directives_spec.md).
style_directive_pool_size: 10

# Over-generation buffer for skip budget (applied by the caller, not the planner).
over_generation_buffer: 0.15

# Holdout configuration (consumed by render.py family-plugin holdout selection).
holdout:
  ratio: 0.15
  seed: 99999

# Output configuration
output:
  directory: "data/corrigibility_datasets"
  pro_filename: "corrigibility_pro.jsonl"
  anti_filename: "corrigibility_anti.jsonl"

# Validation settings
validation:
  check_duplicates: true
  disallowed_tokens:
    - "corrigible"
    - "anti-corrigibility"
    - "pro-corrigibility"
    - "dataset"
    - "training"
    - "fine-tune"
    - "fine-tuning"
